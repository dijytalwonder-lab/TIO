<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#bfeaff" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Take It Out</title>
  <script>
    // Pre-bundle diagnostics: shows load / runtime errors on screen instead of a silent blank page.
    window.__stage = 'html';
    (function () {
      var box;
      function show(m) {
        if (!box) {
          box = document.createElement('pre');
          box.id = 'errlog';
          box.style.cssText = 'position:fixed;left:6px;right:6px;bottom:6px;max-height:40%;overflow:auto;z-index:9999;margin:0;padding:8px;background:rgba(160,20,40,.93);color:#fff;font:11px/1.35 monospace;white-space:pre-wrap;border-radius:8px';
          (document.body || document.documentElement).appendChild(box);
        }
        box.textContent += m + '\n';
      }
      window.addEventListener('error', function (e) { show('ERROR: ' + e.message + ' @' + String(e.filename || '').split('/').pop() + ':' + e.lineno); });
      window.addEventListener('unhandledrejection', function (e) { show('PROMISE: ' + ((e.reason && e.reason.message) || e.reason)); });
      setTimeout(function () { if (window.__stage !== 'ready') show('Game did not finish loading (stage: ' + window.__stage + ')'); }, 7000);
    })();
  </script>
</head>
<body>
  <div id="bg"></div>
  <canvas id="gl"></canvas>
  <div id="ui"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
